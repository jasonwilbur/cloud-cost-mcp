name: Refresh pricing data

# Re-fetches live AWS/Azure/GCP pricing from instances.vantage.sh + the Azure
# Retail Prices API and opens a PR when anything changed. OCI bundled data is
# curated separately and is not touched here.
on:
  schedule:
    - cron: '17 6 * * 1' # every Monday 06:17 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch latest pricing data
        run: npm run fetch-data
      - name: Verify it still builds and tests pass
        run: |
          npm run build
          npm test
      - name: Open a PR if data changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): weekly pricing refresh'
          branch: automated/pricing-refresh
          delete-branch: true
          title: 'chore(data): weekly pricing refresh'
          body: |
            Automated weekly refresh of AWS/Azure/GCP pricing from upstream sources.
            Review the diff to confirm the numbers look sane before merging.
          add-paths: |
            src/data/bundled/*.json
